name: Verify Prototype
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build src/Web/SR.Web/SR.Web.csproj -c Release
      - name: Publish
        run: dotnet publish src/Web/SR.Web/SR.Web.csproj -c Release --no-build -o artifacts/publish
      - name: Build Container
        run: docker build -t sidelinereel:verify .
      - uses: actions/upload-artifact@v4
        with:
          name: sidelinereel-publish
          path: artifacts/publish
